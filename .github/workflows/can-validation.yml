name: CAN validator static analysis and seeded tests
on:
  push:
  pull_request:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and execute seeded regression fixtures
        run: python3 -m unittest discover -s tests -v
      - name: Run Clang Static Analyzer
        run: clang++ --analyze -std=c++17 -Wall -Wextra cpp/can_validate.cpp
